name: Publish FFmpeg Companion Image

on:
  schedule:
    - cron: '0 6 * * 1'
  push:
    tags:
      - 'ffmpeg-v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  FFMPEG_IMAGE_NAME: ${{ github.repository }}-ffmpeg

jobs:
  publish-ffmpeg:
    name: Refresh FFmpeg Provider Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (ffmpeg-provider)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.FFMPEG_IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build and push ffmpeg-provider image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ffmpeg-provider
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=ffmpeg-provider
          cache-to: type=gha,scope=ffmpeg-provider,mode=max
